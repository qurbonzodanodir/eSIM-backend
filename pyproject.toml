[project]
name = "esim-backend"
version = "0.1.0"
description = "eSIM reseller backend service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.28",
    "phonenumbers>=9.0",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
